<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>JSON leaf viewer</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #151615;
            --paper: #f3eadb;
            --paper-deep: #e5d6c0;
            --ember: #dd5a2a;
            --error: #a71919;
            --error-paper: #ffe8e3;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            background: var(--ink);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            display: grid;
            grid-template-columns: minmax(20rem, 46%) minmax(0, 54%);
            min-height: 100vh;
        }

        .input-pane,
        .results-pane {
            min-width: 0;
            padding: clamp(1.25rem, 3vw, 3rem);
        }

        .input-pane {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background:
                linear-gradient(90deg, transparent 0 98%, rgba(255, 255, 255, .035) 98%),
                #151615;
            color: #f7f0e5;
            border-right: .55rem solid var(--ember);
        }

        .eyebrow {
            margin: 0 0 .7rem;
            color: #c4b7a5;
            font: 700 .72rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            letter-spacing: .17em;
            text-transform: uppercase;
        }

        h1,
        h2 {
            margin: 0;
            font-weight: 900;
            letter-spacing: -.045em;
        }

        h1 {
            max-width: 12ch;
            font-size: clamp(2.25rem, 5vw, 5.6rem);
            line-height: .88;
        }

        h2 {
            font-size: clamp(2rem, 4vw, 4.6rem);
            line-height: .95;
        }

        .input-label {
            display: block;
            margin: 1.6rem 0 .65rem;
            color: #d7cbbb;
            font: 700 .78rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        textarea {
            flex: 1;
            width: 100%;
            min-height: 62vh;
            resize: none;
            padding: 1rem;
            border: 1px solid #4b4c48;
            border-radius: .2rem;
            outline: 3px solid transparent;
            outline-offset: 3px;
            background: #0d0e0d;
            color: #f6ead8;
            caret-color: #ff7a45;
            font: 500 .92rem/1.62 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            tab-size: 2;
        }

        textarea::placeholder {
            color: #777872;
        }

        textarea:focus-visible {
            border-color: #ff8a59;
            outline-color: #ff8a59;
        }

        .results-pane {
            min-height: 100vh;
            background:
                repeating-linear-gradient(0deg, transparent 0 31px, rgba(65, 44, 24, .045) 31px 32px),
                var(--paper);
        }

        .results-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
            padding-bottom: 1.1rem;
            border-bottom: 2px solid var(--ink);
        }

        #status {
            flex: 0 0 auto;
            margin: 0 0 .2rem;
            padding: .35rem .55rem;
            border: 1px solid currentColor;
            font: 800 .7rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .alert {
            margin: 1.25rem 0 0;
            padding: 1rem 1.1rem;
            border: 2px solid var(--error);
            background: var(--error-paper);
            color: var(--error);
            font: 800 1rem/1.35 ui-sans-serif, system-ui, sans-serif;
            box-shadow: .35rem .35rem 0 var(--error);
        }

        .empty {
            max-width: 32rem;
            margin: clamp(4rem, 14vh, 9rem) auto;
            color: #655849;
            font-size: clamp(1.15rem, 2vw, 1.55rem);
            line-height: 1.45;
            text-align: center;
        }

        .table-wrap {
            margin-top: 1.4rem;
            overflow: auto;
            border: 2px solid var(--ink);
            background: rgba(255, 251, 244, .55);
            box-shadow: .45rem .45rem 0 var(--paper-deep);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font: 500 .92rem/1.45 ui-sans-serif, system-ui, sans-serif;
        }

        th,
        td {
            padding: .8rem .9rem;
            border-bottom: 1px solid #aa9984;
            text-align: left;
            vertical-align: top;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--ink);
            color: #fff9ef;
            font: 800 .72rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        tbody th {
            width: 42%;
            background: rgba(229, 214, 192, .38);
            font: 700 .82rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow-wrap: anywhere;
        }

        tbody tr:last-child>* {
            border-bottom: 0;
        }

        code {
            color: #362b22;
            font: 500 .84rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        iframe {
            display: block;
            width: 100%;
            min-height: 7rem;
            border: 1px solid #aa9984;
            background: #fff;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 760px) {
            main {
                grid-template-columns: 1fr;
            }

            .input-pane {
                min-height: auto;
                border-right: 0;
                border-bottom: .45rem solid var(--ember);
            }

            textarea {
                min-height: 52vh;
                resize: vertical;
            }

            .results-pane {
                min-height: 55vh;
            }

            .results-header {
                align-items: start;
                flex-direction: column;
            }

            th,
            td {
                padding: .7rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <section class="input-pane" aria-labelledby="input-title">
            <p class="eyebrow">Raw material</p>
            <h1 id="input-title">JSON, unfolded.</h1>
            <label class="input-label" for="json-input">JSON input</label>
            <textarea id="json-input" placeholder='{"person":{"name":"Ada"},"tags":["math","code"]}' spellcheck="false"
                autocapitalize="off" autocomplete="off"></textarea>
        </section>

        <section class="results-pane" aria-labelledby="results-title">
            <header class="results-header">
                <div>
                    <p class="eyebrow">Leaf index</p>
                    <h2 id="results-title">Key / value</h2>
                </div>
                <p id="status" aria-live="polite">Waiting for input</p>
            </header>

            <div id="error" class="alert" role="alert" hidden>
                The input is not valid JSON.
            </div>

            <p id="empty" class="empty">Paste or type JSON to turn every leaf into a readable row.</p>

            <div id="table-wrap" class="table-wrap" hidden>
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Key</th>
                            <th scope="col">Value</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const input = document.querySelector("#json-input");
        const error = document.querySelector("#error");
        const empty = document.querySelector("#empty");
        const tableWrap = document.querySelector("#table-wrap");
        const rows = document.querySelector("#rows");
        const status = document.querySelector("#status");

        function flattenJson(root) {
            const leaves = [];
            const stack = [{path: "", value: root}];

            while (stack.length) {
                const item = stack.pop();
                const value = item.value;

                if (value !== null && typeof value === "object") {
                    const entries = Array.isArray(value)
                        ? value.map((child, index) => [`[${index}]`, child])
                        : Object.entries(value);

                    if (!entries.length) {
                        leaves.push({key: item.path || "$", value});
                        continue;
                    }

                    for (let index = entries.length - 1; index >= 0; index--) {
                        const [part, child] = entries[index];
                        const path = Array.isArray(value)
                            ? `${item.path}${part}`
                            : item.path ? `${item.path}.${part}` : part;
                        stack.push({path, value: child});
                    }
                } else {
                    leaves.push({key: item.path || "$", value});
                }
            }

            return leaves;
        }

        window.flattenJson = flattenJson;

        function containsHtmlElement(value) {
            const template = document.createElement("template");
            template.innerHTML = value;
            return Boolean(template.content.querySelector("*"));
        }

        function htmlPreview(value) {
            const frame = document.createElement("iframe");
            frame.title = "Rendered HTML value";
            frame.setAttribute("sandbox", "");
            frame.referrerPolicy = "no-referrer";
            frame.loading = "lazy";
            frame.srcdoc = `<!doctype html>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; media-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; navigate-to 'none'">
        <style>
          html { color-scheme: light; }
          body { margin: .75rem; color: #211d18; font: 16px/1.45 system-ui, sans-serif; overflow-wrap: anywhere; }
          img, video, iframe { max-width: 100%; }
        </style>
        ${value}`;
            return frame;
        }

        function renderValue(value) {
            if (typeof value === "string" && containsHtmlElement(value)) {
                return htmlPreview(value);
            }

            const code = document.createElement("code");
            code.textContent = typeof value === "string"
                ? value
                : JSON.stringify(value) ?? String(value);
            return code;
        }

        function render() {
            const source = input.value;
            error.hidden = true;
            rows.replaceChildren();

            if (!source.trim()) {
                empty.hidden = false;
                tableWrap.hidden = true;
                status.textContent = "Waiting for input";
                return;
            }

            let data;
            try {
                data = JSON.parse(source);
            } catch {
                error.hidden = false;
                empty.hidden = true;
                tableWrap.hidden = true;
                status.textContent = "Invalid";
                return;
            }

            const leaves = flattenJson(data);
            const fragment = document.createDocumentFragment();

            for (const leaf of leaves) {
                const row = document.createElement("tr");
                const key = document.createElement("th");
                const value = document.createElement("td");
                key.scope = "row";
                key.textContent = leaf.key;
                value.append(renderValue(leaf.value));
                row.append(key, value);
                fragment.append(row);
            }

            rows.append(fragment);
            empty.hidden = true;
            tableWrap.hidden = false;
            status.textContent = `${leaves.length} ${leaves.length === 1 ? "leaf" : "leaves"}`;
        }

        let pendingFrame;
        input.addEventListener("input", () => {
            cancelAnimationFrame(pendingFrame);
            pendingFrame = requestAnimationFrame(render);
        });
    </script>
</body>

</html>
