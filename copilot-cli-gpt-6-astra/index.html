<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON visualizer</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f6f2e9;
            --ink: #192a2b;
            --rule: #d6d9ce;
            --accent: #0b756b;
            --mono: Menlo, Consolas, "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            padding: 20px 28px;
            border-bottom: 1px solid var(--rule);
        }

        h1 {
            margin: 0;
            font: 500 1.9rem/1.1 "Iowan Old Style", Georgia, serif;
            letter-spacing: -.035em;
        }

        h1 span {
            color: var(--accent);
        }

        header p {
            margin: 0;
            color: #596660;
            font-size: .75rem;
        }

        main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        }

        section {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .editor {
            background: var(--ink);
            color: #e5ede7;
            border-right: 1px solid #344745;
        }

        .panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--rule);
            flex-shrink: 0;
        }

        .editor .panel-head {
            border-color: #344745;
        }

        h2 {
            margin: 0;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .panel-number {
            opacity: .55;
            margin-right: 10px;
            font-family: var(--mono);
        }

        #count {
            color: var(--accent);
            font: .72rem var(--mono);
        }

        textarea {
            display: block;
            width: 100%;
            flex: 1;
            min-height: 0;
            min-width: 0;
            margin: 0;
            padding: 22px 24px;
            resize: none;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: inherit;
            caret-color: #85dbca;
            font: .875rem/1.75 var(--mono);
            tab-size: 2;
            overflow-wrap: anywhere;
        }

        textarea::placeholder {
            color: #a3b6ad;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -3px;
        }

        textarea:focus-visible {
            outline-color: #85dbca;
        }

        .hint {
            margin: 0;
            padding: 14px 24px;
            border-top: 1px solid #344745;
            color: #aec0b7;
            font-size: .73rem;
            line-height: 1.5;
        }

        .table-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            scrollbar-gutter: stable;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }

        col:first-child {
            width: 40%;
        }

        th,
        td {
            padding: 15px 22px;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid var(--rule);
            overflow-wrap: anywhere;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--paper);
            font-size: .75rem;
            font-weight: 600;
        }

        tbody th,
        td {
            font: .79rem/1.65 var(--mono);
            white-space: pre-wrap;
        }

        tbody th {
            color: #4a5c55;
        }

        td.scalar {
            color: var(--accent);
        }

        iframe {
            display: block;
            width: 100%;
            height: 10.5rem;
            border: 1px solid #c6cec2;
            background: white;
        }

        .error {
            padding: 17px 24px;
            background: #fbe5e0;
            color: #a02c20;
            border-bottom: 1px solid #d5a59c;
        }

        .error strong {
            font-size: .9rem;
        }

        .error p {
            margin: 6px 0 0;
            font-size: .8rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 760px) {
            body {
                height: auto;
                min-height: 100dvh;
                overflow: auto;
            }

            header {
                padding: 18px 20px;
            }

            main {
                display: flex;
                flex-direction: column;
                flex: none;
            }

            .editor {
                height: 62dvh;
                min-height: 360px;
                border-right: 0;
            }

            .result {
                height: 72dvh;
                min-height: 380px;
            }

            .panel-head {
                padding: 16px 20px;
            }

            textarea {
                padding: 20px;
            }

            th,
            td {
                padding: 12px 16px;
            }

            col:first-child {
                width: 36%;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>JSON <span>visualizer</span></h1>
        <p>Offline / no uploads</p>
    </header>
    <main>
        <section class="editor" aria-labelledby="input-title">
            <div class="panel-head">
                <h2 id="input-title"><span class="panel-number" aria-hidden="true">01</span><label for="json-input">JSON
                        input</label></h2>
            </div>
            <!-- ponytail: native textarea, no highlighting; revisit only if syntax editing is required. -->
            <textarea id="json-input" spellcheck="false" autocomplete="off" autocapitalize="off"
                aria-describedby="input-hint" aria-errormessage="error" aria-invalid="false"
                placeholder="Paste a JSON value here..." wrap="soft"></textarea>
            <p id="input-hint" class="hint">Edit or paste JSON. The table updates as you type.</p>
        </section>
        <section class="result" aria-labelledby="output-title">
            <div id="error" class="error" role="alert" aria-atomic="true" hidden>
                <strong>Input is not valid JSON.</strong>
                <p id="error-detail"></p>
            </div>
            <div class="panel-head">
                <h2 id="output-title"><span class="panel-number" aria-hidden="true">02</span>Flattened values</h2>
                <span id="count" role="status" aria-live="polite" aria-atomic="true"></span>
            </div>
            <div id="table-scroll" class="table-scroll" tabindex="0" role="region" aria-label="Flattened JSON results">
                <table id="result-table">
                    <caption class="sr-only">JSON paths and leaf values</caption>
                    <colgroup>
                        <col>
                        <col>
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">Key</th>
                            <th scope="col">Value</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        "use strict";

        function flatten(root) {
            const rows = [];
            const stack = [{path: "", value: root}];
            while (stack.length) {
                const {path, value} = stack.pop();
                if (value !== null && typeof value === "object") {
                    const keys = Object.keys(value);
                    if (keys.length) {
                        for (let i = keys.length - 1; i >= 0; i--) {
                            const key = keys[i];
                            const next = Array.isArray(value) ? `${path}[${key}]`
                                : /^[A-Za-z_][A-Za-z0-9_]*$/.test(key) ? (path ? `${path}.${key}` : key)
                                    : `${path}[${JSON.stringify(key)}]`;
                            stack.push({path: next, value: value[key]});
                        }
                        continue;
                    }
                }
                rows.push([path || "$", value]);
            }
            return rows;
        }

        function valueText(value) {
            if (typeof value === "string") return JSON.stringify(value);
            if (value !== null && typeof value === "object") return Array.isArray(value) ? "[]" : "{}";
            return Object.is(value, -0) ? "-0" : String(value);
        }

        function isHTML(value) {
            return typeof value === "string" &&
                /<\/?[a-z][\w:-]*(?:\s+[^<>]*)?\/?>|&(?:#\d+|#x[\da-f]+|[a-z][a-z0-9]+);/i.test(value);
        }

        // Run selfTest() in the browser console.
        function selfTest() {
            const assert = (condition, message) => {if (!condition) throw new Error(message);};
            const fixture = JSON.parse(String.raw`{
        "0": "numeric", "user": {"name": "Ada"},
        "items": [{"id": 0}, false, null, "", {}, []],
        "a": {"b": "nested"}, "a.b": "literal", "": "empty key",
        "items[0].id": "brackets", "quote\"key": "quote",
        "$": "dollar", "__proto__": {"safe": true}
      }`);
            const expected = [
                ['["0"]', "numeric"], ["user.name", "Ada"],
                ["items[0].id", 0], ["items[1]", false], ["items[2]", null],
                ["items[3]", ""], ["items[4]", {}], ["items[5]", []],
                ["a.b", "nested"], ['["a.b"]', "literal"], ['[""]', "empty key"],
                ['["items[0].id"]', "brackets"], ['["quote\\"key"]', "quote"],
                ['["$"]', "dollar"], ["__proto__.safe", true]
            ];
            assert(JSON.stringify(flatten(fixture)) === JSON.stringify(expected), "Flattened paths or values differ");
            assert([null, false, true, 0, 42, "", "text", {}, []].every(value =>
                JSON.stringify(flatten(value)) === JSON.stringify([["$", value]])), "Root leaf value lost");
            assert(JSON.stringify(flatten([0, null, {}])) ===
                JSON.stringify([["[0]", 0], ["[1]", null], ["[2]", {}]]), "Root array paths differ");
            assert(valueText(JSON.parse("1e400")) === "Infinity" && valueText(-0) === "-0" &&
                valueText("") === '""', "Scalar display lost information");
            assert(isHTML("<b>hello</b>") && isHTML("&amp;") &&
                !isHTML("5 < 10 && 12 > 3"), "HTML detection differs");
            let deep = 1;
            for (let i = 0; i < 12000; i++) deep = [deep];
            const leaf = flatten(deep);
            assert(leaf.length === 1 && leaf[0][0].length === 36000 && leaf[0][1] === 1, "Deep nesting failed");
            return "selfTest passed";
        }

        const input = document.getElementById("json-input");
        const body = document.getElementById("rows");
        const table = document.getElementById("result-table");
        const errorBox = document.getElementById("error");
        const detail = document.getElementById("error-detail");
        const count = document.getElementById("count");
        const scroller = document.getElementById("table-scroll");
        const policy = "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'";
        const previewHead = '<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="' +
            policy + '"><meta charset="utf-8"><meta http-equiv="x-dns-prefetch-control" content="off"><style>' +
            'body{margin:12px;color:#192a2b;background:white;font:14px/1.5 sans-serif;overflow-wrap:anywhere}' +
            'img,svg{max-width:100%;height:auto}pre{white-space:pre-wrap}' +
            '</style></head><body inert>';

        function render() {
            let data;
            try {
                data = JSON.parse(input.value);
            } catch (error) {
                if (!(error instanceof SyntaxError)) throw error;
                body.replaceChildren();
                table.hidden = true;
                input.setAttribute("aria-invalid", "true");
                errorBox.hidden = false;
                detail.textContent = input.value.trim() ? error.message : "Enter a JSON value to begin.";
                count.textContent = "No entries";
                scroller.scrollTop = 0;
                return;
            }
            const rows = flatten(data);
            const fragment = document.createDocumentFragment();
            for (const [path, value] of rows) {
                const row = document.createElement("tr");
                const key = document.createElement("th");
                const cell = document.createElement("td");
                key.scope = "row";
                key.textContent = path;
                if (isHTML(value)) {
                    const frame = document.createElement("iframe");
                    frame.setAttribute("sandbox", "");
                    frame.title = "Read-only HTML preview for " + path;
                    frame.referrerPolicy = "no-referrer";
                    frame.loading = "lazy";
                    frame.tabIndex = 0;
                    // CSP precedes all input; inert keeps links from navigating the preview.
                    frame.srcdoc = previewHead + value + "</body></html>";
                    // ponytail: fixed-height, display-only previews scroll internally; revisit if interactive previews are required.
                    const source = document.createElement("span");
                    source.className = "sr-only";
                    source.textContent = "HTML source: " + value;
                    cell.append(source, frame);
                } else {
                    cell.textContent = valueText(value);
                    if (typeof value !== "string") cell.className = "scalar";
                }
                row.append(key, cell);
                fragment.append(row);
            }
            body.replaceChildren(fragment);
            table.hidden = false;
            errorBox.hidden = true;
            detail.textContent = "";
            input.setAttribute("aria-invalid", "false");
            count.textContent = `${rows.length} ${rows.length === 1 ? "entry" : "entries"}`;
        }

        input.value = JSON.stringify({
            project: {name: "Field notes", published: false},
            tags: ["draft", "offline"],
            revision: 0,
            owner: null,
            preview: '<div style="padding:14px;background:#edf5f0;border-left:3px solid #0b756b">' +
                '<strong>HTML, rendered.</strong><p style="margin:6px 0 0">Formatting stays inside this cell.</p></div>'
        }, null, 2);
        input.addEventListener("input", render);
        render();
    </script>
</body>

</html>
