<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Flatten & Render</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: row;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid #ddd;
        }

        #alert {
            background: #ff4d4d;
            color: white;
            padding: 10px;
            display: none;
            font-weight: bold;
            text-align: center;
        }

        /* Left Panel - Editor Styling */
        #editor-container {
            flex: 1;
            position: relative;
            background: #282c34;
        }

        #json-input,
        #highlight-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: none;
            outline: none;
        }

        #json-input {
            color: transparent;
            background: transparent;
            caret-color: white;
            z-index: 2;
            resize: none;
        }

        #highlight-layer {
            color: #abb2bf;
            z-index: 1;
            overflow-y: auto;
        }

        /* Syntax Colors */
        .key {
            color: #e06c75;
        }

        .string {
            color: #98c379;
        }

        .number {
            color: #d19a66;
        }

        .boolean {
            color: #56b6c2;
        }

        .null {
            color: #c678dd;
        }

        /* Right Panel - Table Styling */
        #output-panel {
            background: #f9f9f9;
            overflow-y: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #eee;
            position: sticky;
            top: -20px;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Left Panel -->
        <div class="panel">
            <div id="editor-container">
                <div id="highlight-layer"></div>
                <textarea id="json-input" spellcheck="false" placeholder="Paste JSON here..."></textarea>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="panel" id="output-panel">
            <div id="alert">Invalid JSON</div>
            <table id="result-table">
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Value (Rendered)</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const input = document.getElementById('json-input');
        const highlightLayer = document.getElementById('highlight-layer');
        const alertBox = document.getElementById('alert');
        const tableBody = document.getElementById('table-body');

        // Synchronize scrolling
        input.addEventListener('scroll', () => {
            highlightLayer.scrollTop = input.scrollTop;
        });

        input.addEventListener('input', () => {
            const rawValue = input.value;

            // 1. Syntax Highlighting logic
            highlightLayer.innerHTML = syntaxHighlight(rawValue);

            // 2. JSON Processing
            try {
                if (rawValue.trim() === "") {
                    tableBody.innerHTML = "";
                    alertBox.style.display = "none";
                    return;
                }

                const parsed = JSON.parse(rawValue);
                alertBox.style.display = "none";

                const flattened = {};
                flatten(parsed, "", flattened);

                renderTable(flattened);
            } catch (e) {
                alertBox.style.display = "block";
            }
        });

        function flatten(obj, prefix, res) {
            for (let key in obj) {
                const propName = prefix ? `${prefix}.${key}` : key;
                if (typeof obj[key] === 'object' && obj[key] !== null) {
                    flatten(obj[key], propName, res);
                } else {
                    res[propName] = obj[key];
                }
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = "";
            for (const [key, value] of Object.entries(data)) {
                const row = document.createElement('tr');
                const keyCell = document.createElement('td');
                const valCell = document.createElement('td');

                keyCell.textContent = key;
                // Render as HTML
                valCell.innerHTML = value === null ? "null" : value.toString();

                row.appendChild(keyCell);
                row.appendChild(valCell);
                tableBody.appendChild(row);
            }
        }

        function syntaxHighlight(json) {
            if (!json) return "";
            // Basic escaping for HTML tags in the raw text to prevent breaking the highlight layer
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }
    </script>

</body>

</html>
