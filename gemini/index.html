<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Flattener & Viewer</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --border-color: #d1d5db;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --error-border: #f87171;
            --th-bg: #f9fafb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel-bg);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 24px;
            gap: 24px;
        }

        .panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            background: var(--th-bg);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 16px;
            border: none;
            resize: none;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            background: #fafafa;
        }

        textarea:focus {
            background: #ffffff;
        }

        .right-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .alert {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-weight: 500;
            font-size: 0.9rem;
            display: none; /* Hidden by default */
        }

        .alert.visible {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            word-break: break-word;
        }

        th {
            background-color: var(--th-bg);
            font-weight: 600;
            position: sticky;
            top: 0;
            border-bottom: 2px solid var(--border-color);
        }

        .key-column {
            width: 35%;
            font-family: monospace;
            color: #2563eb;
            font-weight: 600;
        }

        .empty-state {
            color: var(--text-secondary);
            text-align: center;
            margin-top: 40px;
            font-style: italic;
        }

        /* Value Type Colors */
        .type-null { color: #9ca3af; font-style: italic; }
        .type-boolean { color: #db2777; font-weight: 600; }
        .type-number { color: #059669; font-weight: 600; }
        .type-string { color: #4b5563; }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>JSON Flattener & HTML Renderer</h1>
    </header>

    <div class="container">
        <!-- Left Panel: Input -->
        <div class="panel">
            <div class="panel-header">
                <span>Input JSON</span>
                <span style="font-size: 0.8rem; font-weight: normal;">Auto-formats on successful parse</span>
            </div>
            <textarea id="json-input" placeholder="Paste or type your JSON here...
Example:
{
  &quot;title&quot;: &quot;Hello World&quot;,
  &quot;content&quot;: {
    &quot;body&quot;: &quot;<strong>This is bold HTML</strong>&quot;,
    &quot;metrics&quot;: [10, 20, 30]
  }
}"></textarea>
        </div>

        <!-- Right Panel: Output -->
        <div class="panel">
            <div class="panel-header">Flattened Output</div>
            <div class="right-content">
                <div id="error-alert" class="alert"></div>
                
                <div id="empty-state" class="empty-state">
                    Waiting for valid JSON input...
                </div>

                <table id="result-table" style="display: none;">
                    <thead>
                        <tr>
                            <th class="key-column">Key</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('json-input');
        const errorAlert = document.getElementById('error-alert');
        const resultTable = document.getElementById('result-table');
        const tableBody = document.getElementById('table-body');
        const emptyState = document.getElementById('empty-state');

        // Listen for user input
        inputArea.addEventListener('input', handleInput);

        function handleInput() {
            const rawValue = inputArea.value.trim();

            if (!rawValue) {
                hideError();
                hideTable();
                showEmptyState();
                return;
            }

            let parsedJSON;
            try {
                parsedJSON = JSON.parse(rawValue);
                hideError();
            } catch (e) {
                showError("Invalid JSON: " + e.message);
                hideTable();
                hideEmptyState();
                return;
            }

            // Valid JSON -> Process and Render
            hideEmptyState();
            const flattened = flattenJSON(parsedJSON);
            renderTable(flattened);
            showTable();
        }

        /**
         * Recursively flattens a nested JSON object into a single-layer key-value map.
         */
        function flattenJSON(obj, prefix = '') {
            let result = {};

            if (obj === null) {
                result[prefix || 'root'] = null;
                return result;
            }

            if (typeof obj !== 'object') {
                result[prefix || 'root'] = obj;
                return result;
            }

            // Handle empty objects and arrays
            if (Object.keys(obj).length === 0) {
                result[prefix || 'root'] = Array.isArray(obj) ? "[]" : "{}";
                return result;
            }

            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    // Create dotted notation for nested keys
                    const newKey = prefix ? `${prefix}.${key}` : key;
                    const val = obj[key];

                    // Recurse if it's an object or array with content
                    if (val !== null && typeof val === 'object' && Object.keys(val).length > 0) {
                        Object.assign(result, flattenJSON(val, newKey));
                    } else {
                        // Base case: Primitive values, null, or empty objects/arrays
                        result[newKey] = val;
                    }
                }
            }
            return result;
        }

        /**
         * Renders the flattened JSON map into the HTML table
         */
        function renderTable(flatData) {
            tableBody.innerHTML = ''; // Clear previous rows

            for (const [key, val] of Object.entries(flatData)) {
                const tr = document.createElement('tr');
                
                const tdKey = document.createElement('td');
                tdKey.className = 'key-column';
                tdKey.textContent = key;

                const tdValue = document.createElement('td');
                
                // Determine how to display the value
                if (val === null) {
                    tdValue.textContent = "null";
                    tdValue.className = 'type-null';
                } else if (typeof val === 'boolean') {
                    tdValue.textContent = String(val);
                    tdValue.className = 'type-boolean';
                } else if (typeof val === 'number') {
                    tdValue.textContent = String(val);
                    tdValue.className = 'type-number';
                } else if (typeof val === 'string') {
                    // Check if string contains HTML tags
                    if (/<\/?[a-z][\s\S]*>/i.test(val)) {
                        tdValue.innerHTML = val; // Render HTML
                    } else {
                        tdValue.textContent = val; // Safe text
                        tdValue.className = 'type-string';
                    }
                } else {
                    // Fallback for empty objects/arrays that weren't flattened further
                    tdValue.textContent = typeof val === 'object' ? JSON.stringify(val) : String(val);
                }

                tr.appendChild(tdKey);
                tr.appendChild(tdValue);
                tableBody.appendChild(tr);
            }
        }

        // --- UI Helpers --- //

        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.classList.add('visible');
        }

        function hideError() {
            errorAlert.classList.remove('visible');
        }

        function showTable() {
            resultTable.style.display = 'table';
        }

        function hideTable() {
            resultTable.style.display = 'none';
        }

        function showEmptyState() {
            emptyState.style.display = 'block';
        }

        function hideEmptyState() {
            emptyState.style.display = 'none';
        }

        // Optional UX Enhancement: Auto-format valid JSON on blur
        inputArea.addEventListener('blur', () => {
            try {
                const val = inputArea.value.trim();
                if (val) {
                    const parsed = JSON.parse(val);
                    inputArea.value = JSON.stringify(parsed, null, 2);
                }
            } catch (e) {
                // Ignore errors on blur, handled by input event
            }
        });
    </script>
</body>
</html>
